name: Scheduled ETL Scraper

on:
  schedule:
    # Run daily at 6:30 AM IST (01:00 UTC) to fetch fresh daily morning updates
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger via the GitHub Action UI

jobs:
  run-etl:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants write access to push commits back to repository
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Pipeline
        run: |
          # Change directory to scraper to ensure relative paths (../data) resolve correctly
          cd scraper
          python etl_pipeline.py

      - name: Commit and Push Database Update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/hacker_news.db
          # Only commit if the database actually changed
          git diff --quiet && git diff --staged --quiet || git commit -m "data: daily ETL database auto-update [skip ci]"
          git push
